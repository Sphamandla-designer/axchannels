name: Deploy Pages preview

# Publishes the site to the gh-pages branch, which GitHub Pages serves.
# (Direct "GitHub Actions" Pages deployment needs Pages enabled by a repo
# admin first; branch publishing auto-enables it.)

on:
  push:
    branches: [claude/ax-channels-website-oycl4p]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git push -f origin gh-pages
