name: Deploy Pages preview

# Publishes the site to the gh-pages branch, which GitHub Pages serves.
# (Direct "GitHub Actions" Pages deployment needs Pages enabled by a repo
# admin first; branch publishing auto-enables it.)

on:
  push:
    branches: [claude/ax-channels-website-oycl4p]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          # Publish the site only. Design sources kept in the repo (earlier
          # design previews, screenshots, PDFs and logo uploads at the root)
          # are dropped from the published branch, so no older design of
          # the site is reachable at a URL.
          # CNAME is not a page, but it must survive: GitHub Pages reads it
          # from the published branch to serve the custom domain, and a
          # deploy that dropped it would silently unset the domain.
          keep=" index.html favicon.svg apple-touch-icon.png robots.txt sitemap.xml CNAME .nojekyll assets services case-studies privacy terms .github "
          for f in * .[!.]*; do
            [ -e "$f" ] || continue
            [ "$f" = ".git" ] && continue
            case "$keep" in *" $f "*) ;; *) git rm -r -q --cached -- "$f" ;; esac
          done
          git commit -q -m "Publish the site only" || true
          git push -f origin gh-pages
